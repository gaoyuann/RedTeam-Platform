version: '3.8'
services:
  webgoat:
    image: webgoat/webgoat:latest
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/WebGoat/"]
      interval: 10s
      timeout: 10s
      retries: 30
